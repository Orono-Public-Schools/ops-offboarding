<!-- @dsCard group="Layout" viewport="700x250" subtitle="White at reduced opacity — the only vocabulary allowed on the shell" name="On-dark elements" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>On-dark elements</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:20px 22px;font:var(--type-body);color:var(--text-body)}
.card{background:var(--surface-card);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:20px}
.g{display:grid;gap:14px}
.sw i{height:48px;display:block;border-radius:8px 8px 0 0}
.sw b{font:var(--type-caption);font-weight:400;color:var(--text-muted);padding:7px 9px;display:flex;justify-content:space-between;gap:6px;background:#fff;border-radius:0 0 8px 8px}
.sw{border-radius:8px;overflow:hidden;box-shadow:var(--shadow-card)}
.lbl{font:var(--type-field-label);letter-spacing:var(--tracking-wider);text-transform:uppercase;color:var(--text-muted)}
.ondark{font:var(--type-caption);color:var(--on-dark-muted)}
h3.ch{margin:0 0 14px;font:var(--type-card-heading);letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--dark)}
</style></head><body>
<div class="g" style="gap:12px">
 <div style="color:#fff;font:var(--type-strong)">White — page titles</div>
 <div style="color:var(--on-dark-muted);font:var(--type-body)">60% — subtitles and supporting copy</div>
 <div style="color:var(--on-dark-faint);font:var(--type-body)">50% — inactive tabs, eyebrows</div>
 <div style="padding:10px 14px;border-radius:8px;background:var(--on-dark-hover);color:#fff;font:var(--type-body-sm)">8% fill — hover on dark</div>
 <div style="padding:16px;border-radius:12px;background:var(--on-dark-fill);border:1px dashed var(--on-dark-border);color:#fff;font:var(--type-body-sm);text-align:center">6% fill + 1px dashed 15% border — empty states</div>
 </div>
</body></html>
