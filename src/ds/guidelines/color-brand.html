<!-- @dsCard group="Colors" viewport="700x190" subtitle="Navy anchor through primary and secondary, with red held back for action" name="Brand ramp" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Brand ramp</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:20px 22px;font:var(--type-body);color:var(--text-body)}
.card{background:var(--surface-card);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:20px}
.g{display:grid;gap:14px}
.sw i{height:48px;display:block;border-radius:8px 8px 0 0}
.sw b{font:var(--type-caption);font-weight:400;color:var(--text-muted);padding:7px 9px;display:flex;justify-content:space-between;gap:6px;background:#fff;border-radius:0 0 8px 8px}
.sw{border-radius:8px;overflow:hidden;box-shadow:var(--shadow-card)}
.lbl{font:var(--type-field-label);letter-spacing:var(--tracking-wider);text-transform:uppercase;color:var(--text-muted)}
.ondark{font:var(--type-caption);color:var(--on-dark-muted)}
h3.ch{margin:0 0 14px;font:var(--type-card-heading);letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--dark)}
</style></head><body>
<div class="g" style="grid-template-columns:repeat(5,1fr)">
 <div class="sw"><i style="background:var(--dark)"></i><b><span>dark</span></b><b style="padding-top:0"><span>#1d2a5d</span><span style="color:var(--text-placeholder)">anchor</span></b></div><div class="sw"><i style="background:var(--primary)"></i><b><span>primary</span></b><b style="padding-top:0"><span>#2d3f89</span><span style="color:var(--text-placeholder)">buttons</span></b></div><div class="sw"><i style="background:var(--secondary)"></i><b><span>secondary</span></b><b style="padding-top:0"><span>#4356a9</span><span style="color:var(--text-placeholder)">outlines</span></b></div><div class="sw"><i style="background:var(--tint)"></i><b><span>tint</span></b><b style="padding-top:0"><span>#eaecf5</span><span style="color:var(--text-placeholder)">light bg</span></b></div><div class="sw"><i style="background:var(--accent)"></i><b><span>accent</span></b><b style="padding-top:0"><span>#ad2122</span><span style="color:var(--text-placeholder)">submit only</span></b></div>
 </div>
 <p class="ondark" style="margin:16px 0 0">The accent appears only on submit and destructive controls, plus the active tab. Anywhere else it is a bug.</p>
</body></html>
