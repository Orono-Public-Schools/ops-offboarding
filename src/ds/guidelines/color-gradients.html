<!-- @dsCard group="Colors" viewport="700x220" subtitle="Page shell, primary buttons, active tab" name="Gradients" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Gradients</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:20px 22px;font:var(--type-body);color:var(--text-body)}
.card{background:var(--surface-card);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:20px}
.g{display:grid;gap:14px}
.sw i{height:48px;display:block;border-radius:8px 8px 0 0}
.sw b{font:var(--type-caption);font-weight:400;color:var(--text-muted);padding:7px 9px;display:flex;justify-content:space-between;gap:6px;background:#fff;border-radius:0 0 8px 8px}
.sw{border-radius:8px;overflow:hidden;box-shadow:var(--shadow-card)}
.lbl{font:var(--type-field-label);letter-spacing:var(--tracking-wider);text-transform:uppercase;color:var(--text-muted)}
.ondark{font:var(--type-caption);color:var(--on-dark-muted)}
h3.ch{margin:0 0 14px;font:var(--type-card-heading);letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--dark)}
</style></head><body>
<div class="g" style="gap:14px">
 <div><div style="height:52px;border-radius:10px;background:var(--gradient-page)"></div><div class="ondark" style="margin-top:6px">page shell — set on body, fixed attachment</div></div><div><div style="height:52px;border-radius:10px;background:var(--gradient-primary)"></div><div class="ondark" style="margin-top:6px">primary buttons, filled progress, done checkboxes</div></div><div><div style="height:52px;border-radius:10px;background:var(--gradient-accent)"></div><div class="ondark" style="margin-top:6px">active tab only, with a colored glow</div></div>
 </div>
</body></html>
